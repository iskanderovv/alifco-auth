# Dev database: docker compose up -d db. POSTGRES_PORT changes the host port.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth
      POSTGRES_DB: oauth
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oauth -d oauth']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
