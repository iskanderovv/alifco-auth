name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oauth
          POSTGRES_PASSWORD: oauth
          POSTGRES_DB: oauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oauth -d oauth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://oauth:oauth@localhost:5432/oauth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npx eslint "src/**/*.ts" "test/**/*.ts"
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run test:int
      - run: npm run build
