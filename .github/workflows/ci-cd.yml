name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oauth
          POSTGRES_PASSWORD: oauth
          POSTGRES_DB: oauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oauth -d oauth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://oauth:oauth@localhost:5432/oauth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npx eslint "src/**/*.ts" "test/**/*.ts"
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run test:int
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes)

          scp "${ssh_opts[@]}" deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh "$SSH_USER@$SSH_HOST:/opt/alifco-auth/"

          # shellcheck disable=SC2029  # IMAGE and REGISTRY_USER are meant to expand here
          printf '%s' "$REGISTRY_TOKEN" | ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin >/dev/null && IMAGE='$IMAGE' bash /opt/alifco-auth/deploy.sh; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
